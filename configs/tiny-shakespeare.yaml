# Tiny Shakespeare char-level config

dataset: tiny-shakespeare
data_dir: data/tiny-shakespeare
out_dir: out/tiny-shakespeare

# model
n_layer: 6
n_head: 6
n_embd: 384
block_size: 256
dropout: 0.2
bias: false

# training
batch_size: 64
max_iters: 5000
eval_interval: 250
eval_iters: 200
learning_rate: 3.0e-4
min_lr: 3.0e-5
warmup_iters: 100
lr_decay_iters: 5000
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0

# system
device: cuda
seed: 1337
log_interval: 10
